name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # позволит запускать вручную

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Install Buildozer and Cython
        run: |
          pip install buildozer cython==0.29.21

      - name: Create buildozer.spec
        run: |
          cat > buildozer.spec << 'EOF'
          [buildozer]
          allow_root = True

          [app]
          title = Птицы Приморья
          package.name = birdsofprimorye
          version = 1.0
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,json
          requirements = python3,kivy==2.1.0,kivymd==0.104.2,plyer,cython==3.0.10
          android.permissions = CAMERA, READ_EXTERNAL_STORAGE, WRITE_EXTERNAL_STORAGE
          android.api = 33
          android.minapi = 21
          android.accept_sdk_license = True
          EOF

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: birdsofprimorye-debug
          path: bin/*.apk
